<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>算数マウンテン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 決まり（AIへのおねがい.md）：紙・すみ色の線2px・角14px・さわると浮いて影・余白は8の倍数・文字は13/16/20/28。
   算数マウンテンらしさ：方眼紙の背景、山の緑、いまのキャンプの黄色。 */
:root{--paper:#fbf7f0;--ink:#2b2118;--mute:#8c7f70;--line:#d9cdbb;--white:#fff;--grid:#d7e6f1;
  --theme:#3fae7a;--theme-soft:#dcf3e8;--now:#f2a516;--now-soft:#fde3a6;--ng:#d9483b;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--ink)}
body{font-family:"BIZ UDPGothic",sans-serif;font-size:16px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere;min-height:100vh;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.k{font-family:"Klee One",serif;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);border-radius:var(--r);background:var(--white);padding:8px 16px;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s ease;box-shadow:0 0 0 var(--ink)}
button:hover{transform:translateY(-4px);box-shadow:0 5px 0 var(--ink)}
button:active{transform:translateY(1px);box-shadow:0 0 0 var(--ink);transition-duration:.06s}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{transform:none;box-shadow:none}
.dark{background:var(--ink);color:var(--paper)}
.lion img{display:block;height:100%;width:auto}
header.bar{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:rgba(251,247,240,.94);border-bottom:2px solid var(--line)}
header.bar h1{margin:0;font-size:20px}
header.bar .back{border:none;background:none;padding:8px 0;font-weight:700}
header.bar .back:hover{transform:none;box-shadow:none}
header.bar .sp{flex:1}
header.bar .link{font-size:13px;border-radius:999px;padding:4px 16px;font-weight:700}
main{max-width:1240px;margin:0 auto;padding:16px 24px}

/* ---------- 山の地図 ---------- */
.mapwrap{display:grid;grid-template-columns:1fr 280px;gap:24px;align-items:start}
.map{width:100%;height:auto;display:block}
.camp{cursor:pointer}
.camp .pic{transition:transform .18s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:center bottom}
.camp:hover .pic{transform:translateY(-4px) scale(1.08)}
.camp.now .pic{animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.camp .tag{transition:transform .18s}
.camp:hover .tag{transform:translateY(-3px)}
.guide{display:flex;flex-direction:column;gap:16px}
.guide .lions{display:flex;gap:8px;height:120px;justify-content:center;align-items:flex-end}
.guide .lions .lion{height:100%}
.say{background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:16px;font-size:20px;line-height:1.6;position:relative}
.camps{display:flex;flex-direction:column;gap:8px}
.camps button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 16px}
.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);font-weight:700;font-size:13px;flex:none;background:var(--white)}
.done .num{background:var(--theme);color:var(--white)}
.now .num{background:var(--now)}
.title{display:flex;align-items:baseline;gap:16px;margin:0 0 8px}
.title h2{margin:0;font-size:28px}
.title span{color:var(--mute)}

/* ---------- キャンプの中 ---------- */
.campv{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
.qcard{background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:24px}
.step{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px;font-weight:700;margin-bottom:8px}
.step i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:inline-block}
.step i.ok{background:var(--theme)}
.step i.cur{background:var(--now)}
.qcard h3{margin:0 0 16px;font-size:28px;line-height:1.6}
.bignum{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}
.bignum .d{display:flex;flex-direction:column;align-items:center;gap:4px}
.bignum .d b,.bignum .d button{display:grid;place-items:center;width:56px;height:64px;border:2px solid var(--ink);border-radius:10px;font-size:36px;background:var(--white);padding:0;font-family:"Klee One",serif;font-weight:600}
.bignum .d small{font-size:13px;color:var(--mute);min-height:1.5em;font-weight:700}
.bignum .d.keep b{background:var(--theme-soft)}
.bignum .d.look b{background:var(--now-soft);outline:3px solid var(--now);outline-offset:2px}
.bignum .d.zero b{color:var(--mute);background:#efe8dc}
.bignum .d.target button{outline:3px dashed var(--now);outline-offset:3px}
.bignum .d.wrong button{background:#fbe1dd}
.bignum .d.right button{background:var(--theme-soft)}
.bignum .d .top{font-size:13px;color:var(--now);font-weight:700;min-height:1.5em}
.ansrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ansrow input{font-family:"Klee One",serif;font-weight:600;font-size:28px;width:6.5em;padding:4px 16px;border:2px solid var(--ink);border-radius:var(--r);text-align:right;background:var(--white)}
.ansrow input:focus{outline:3px solid var(--now);outline-offset:2px}
.ansrow input.ok{background:var(--theme-soft)}
.ansrow input.ng{background:#fbe1dd}
.ansrow button{font-size:20px;font-weight:700;padding:8px 24px}
.ansrow .lbl{font-size:20px;min-width:5em}
/* キャンプ③：3つの やり方を 横に ならべて くらべる */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.methods .ansrow{flex-direction:column;align-items:stretch;gap:8px}
.methods .ansrow .lbl{min-width:0}
.methods .ansrow input{width:100%}
.tool{margin-top:24px;padding-top:16px;border-top:2px dashed var(--line)}
.tool h4{margin:0 0 8px;font-size:13px;color:var(--mute)}
.nl{width:100%;height:auto;display:block;touch-action:none}
.nlctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.nlctl input[type=range]{flex:1 1 100%;accent-color:var(--now)}
.nlctl .stepb{padding:4px 12px;font-size:16px}
.nlctl .val{font-size:28px;min-width:5em;text-align:right}
.found{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.found span{border:2px solid var(--theme);background:var(--theme-soft);border-radius:999px;padding:0 16px;font-size:20px}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.side .lion{height:140px;align-self:center}
.side .lion.pop img{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85)}100%{transform:none}}
.side .say::before{content:"";position:absolute;top:-12px;left:50%;width:18px;height:18px;background:var(--white);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.side .say.hint,.side .say.hint::before{border-color:var(--now)}
.side .say ol{margin:8px 0 0;padding-left:24px;font-size:16px}
.side .lvl{display:flex;gap:4px;justify-content:center;align-items:center;font-size:13px;color:var(--mute)}
.side .lvl i{width:24px;height:6px;border-radius:3px;background:var(--line)}
.side .lvl i.on{background:var(--now)}
.side .more{align-self:center;font-size:13px;border-radius:999px;padding:4px 16px}

/* クリアの おいわい */
.cele{position:fixed;inset:0;display:grid;place-items:center;background:rgba(251,247,240,.85);z-index:9}
.cele .box{background:var(--white);border:2px solid var(--ink);border-radius:var(--r);padding:24px 40px;text-align:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.cele .lions{display:flex;gap:16px;justify-content:center;height:150px}
.cele .lions .lion{height:100%}
.cele h2{font-size:28px;margin:16px 0 8px}
.cele p{margin:0 0 24px;font-size:20px}

@media (prefers-reduced-motion:reduce){.camp.now .pic,.side .lion.pop img,.cele .box{animation:none}button{transition:none}}
@media (max-width:820px){
  main{padding:16px}
  .mapwrap,.campv{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .side .lion{height:80px}
  .bignum .d b,.bignum .d button{width:44px;height:52px;font-size:28px}
  .qcard{padding:16px}
  .qcard h3{font-size:20px}
  .ansrow input{font-size:20px;width:6em}
  .methods{grid-template-columns:1fr;gap:8px}
  .say{font-size:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="cele" class="cele" hidden></div>

<script src="common/lions.js"></script>
<script>
/* ================= 問題（あとで 先生が チェックして 直す） ================= */
const PLACES = ["一", "十", "百", "千", "一万", "十万"];
const MNAME = { half: "四捨五入", up: "切り上げ", down: "切り捨て" };
const MTO = { half: "四捨五入すると", up: "切り上げると", down: "切り捨てると" };
const CAMPS = [
  { name: "位の なまえ", qs: [{ n: 58372, p: 3 }, { n: 64915, p: 4 }, { n: 37208, p: 2 }, { n: 91546, p: 1 }, { n: 250813, p: 5 }, { n: 473062, p: 4 }] },
  { name: "四捨五入", qs: [{ n: 36482, u: 10000 }, { n: 74915, u: 10000 }, { n: 25061, u: 10000 }, { n: 48351, u: 1000 }, { n: 62790, u: 1000 }, { n: 17509, u: 1000 }] },
  { name: "切り上げ・切り捨て", qs: [{ n: 43200 }, { n: 68751 }, { n: 85000 }, { n: 50000 }] },
  { name: "数直線で ためす", qs: [{ m: "half", T: 90000 }, { m: "up", T: 70000 }, { m: "down", T: 30000 }, { m: "half", T: 50000 }] },
  { name: "はんいを 見つける", qs: [{ m: "up", T: 90000 }, { m: "down", T: 90000 }, { m: "half", T: 90000 }, { m: "up", T: 7000, u: 1000 }, { m: "half", T: 3000, u: 1000 }, { m: "down", T: 600, u: 100 }, { m: "up", T: 400, u: 100 }] },
];
const FIND = 2; // キャンプ④で 見つける 数

/* ================= 計算 ================= */
function rnd(n, m, u) { const r = ((n % u) + u) % u, base = n - r; if (m === "up") return r ? base + u : n; if (m === "down") return base; return r >= u / 2 ? base + u : base; }
function range(m, T, u) { if (m === "up") return [T - u + 1, T]; if (m === "down") return [T, T + u - 1]; return [T - u / 2, T + u / 2 - 1]; }
const exp = (u) => String(u).length - 1;          // 10000 → 4
const toPlace = (u) => PLACES[exp(u)];             // 一万
const lookPlace = (u) => PLACES[exp(u) - 1];       // 千
const num = (s) => { s = String(s || "").replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[^\d]/g, ""); return s ? parseInt(s, 10) : null; };

/* ================= ほぞん（この端末だけ） ================= */
const KEY = "sansu-mountain-v1";
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.cleared)) return s; } catch (e) {} return { cleared: [false, false, false, false, false] }; }
let prog = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} }
const nowCamp = () => { const i = prog.cleared.indexOf(false); return i < 0 ? 4 : i; };
const stateOf = (i) => prog.cleared[i] ? "done" : i === nowCamp() ? "now" : "todo";

/* ================= 画面の じょうたい ================= */
let view = "map", ci = 0, qi = 0, miss = 0, solved = false, last = null, X = {};
const $ = (id) => document.getElementById(id);
const L = (k, m) => `<span class="lion">${Lions.svg(k, m)}</span>`;
function startCamp(i) { view = "camp"; ci = i; qi = 0; newQ(); render(); window.scrollTo(0, 0); }
function newQ() { miss = 0; solved = false; last = null; X = {}; nl = null; }

/* ================= 山の地図 ================= */
const CAMP_IMG = { todo: "common/img/camp-mada.png", now: "common/img/camp-ima.png", done: "common/img/camp-dekita.png" };
function campSVG(i, x, y, left) {
  const label = (i === 4 ? "てっぺん：" : "") + CAMPS[i].name, s = stateOf(i);
  const tw = 32 + [...label].length * 18, iw = 64, ih = 57, tx = left ? x - iw / 2 - 8 - tw : x + iw / 2 + 8;
  return `<g class="camp ${s}" onclick="startCamp(${i})" role="button" tabindex="0" aria-label="キャンプ${i + 1} ${CAMPS[i].name}">
    <image class="pic" href="${CAMP_IMG[s]}" x="${x - iw / 2}" y="${y - ih}" width="${iw}" height="${ih}"/>
    <circle cx="${x - iw / 2 + 4}" cy="${y - ih + 4}" r="11" fill="#fff" stroke="#2b2118" stroke-width="2"/>
    <text x="${x - iw / 2 + 4}" y="${y - ih + 9}" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2118" font-family="BIZ UDPGothic">${i + 1}</text>
    <g class="tag"><rect x="${tx}" y="${y - 46}" width="${tw}" height="36" rx="10" fill="#fff" stroke="#2b2118" stroke-width="2"/>
    <text x="${tx + 16}" y="${y - 22}" font-size="18" fill="#2b2118" font-family="Klee One" font-weight="600">${label}</text></g></g>`;
}
function vMap() {
  const pts = [[230, 512], [620, 464], [330, 392], [540, 313], [446, 176]];
  const trail = "M150 540 " + pts.map(([x, y]) => `L${x} ${y - 4}`).join(" ");
  const done = prog.cleared.filter(Boolean).length;
  const msg = done === 5 ? "てっぺんに ついたね！ 何回でも のぼって いいよ。"
    : done ? `キャンプ${done}まで 来たね。つぎは キャンプ${nowCamp() + 1}。ゆっくりで いいよ。`
    : "がい数の 山へ ようこそ！ キャンプで 何回でも 休んで いいよ。まちがえても、ぼくたちが すぐ 横に いるからね。";
  return `<header class="bar"><h1 class="k">算数マウンテン</h1><span class="sp"></span>
      <button class="link" onclick="location.href='https://sunny-lotus.github.io/manabi-portal/'">まなびひろばへ</button></header>
    <main><div class="title"><h2 class="k">がい数の 山</h2><span>キャンプ ${done}／5</span></div>
    <div class="mapwrap">
      <svg class="map" viewBox="0 0 860 560" aria-label="がい数の 山の 地図">
        <image href="common/img/yama.png" x="20" y="153" width="820" height="399"/>
        <path d="${trail}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
        <path d="${trail}" fill="none" stroke="#2b2118" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map(([x, y], i) => campSVG(i, x, y, [false, true, false, true, false][i])).join("")}
      </svg>
      <aside class="guide">
        <div class="lions">${L("hana", done === 5 ? "happy" : "normal")}${L("niji", "normal")}</div>
        <div class="say k">${msg}</div>
        <div class="camps">${CAMPS.map((c, i) => `<button class="${stateOf(i)}" onclick="startCamp(${i})"><span class="num">${i + 1}</span><span class="k">${c.name}</span></button>`).join("")}</div>
      </aside></div></main>`;
}

/* ================= 数字の ならび ================= */
function digitsHTML(n, mode, look) {
  // mode 0：ふつう／1：見る数字を 光らせる／2：のこす・見る・0にする を 色分け。look は「見る数字」の 左からの番号
  const ds = String(n).split(""), L0 = ds.length;
  return `<div class="bignum">${ds.map((d, i) => {
    const cls = mode === 0 ? "" : i < look ? "keep" : i === look ? "look" : mode === 2 ? "zero" : "";
    return `<span class="d ${cls}"><b>${d}</b><small>${mode ? PLACES[L0 - 1 - i] : ""}</small></span>`;
  }).join("")}</div>`;
}

/* ================= 数直線（さわって ためす 道具） ================= */
let nl = null;
function nlInit(m, T, u, start) { nl = { m, T, u, min: T - 1.5 * u, max: T + 1.5 * u, v: start, tried: [], zone: false, mark: false }; }
function nlSVG() {
  const { m, T, u, min, max, v } = nl, X0 = (n) => 20 + (n - min) / (max - min) * 620;
  let s = "";
  if (nl.zone) { const [a, b] = range(m, T, u); s += `<rect x="${X0(a)}" y="36" width="${X0(b) - X0(a)}" height="40" rx="6" fill="#dcf3e8" stroke="#3fae7a" stroke-width="2"/>`; }
  if (nl.mark) s += `<path d="M${X0(T)} 6 v20" stroke="#f2a516" stroke-width="4" stroke-linecap="round"/><text x="${X0(T)}" y="6" text-anchor="middle" font-size="13" font-weight="700" fill="#f2a516" font-family="BIZ UDPGothic">${T}の 近く</text>`;
  s += `<line x1="8" y1="56" x2="652" y2="56" stroke="#2b2118" stroke-width="3"/>`;
  for (let n = min; n <= max; n += u / 10) {
    const big = n % u === 0, h = big ? 14 : n % (u / 2) === 0 ? 10 : 5;
    s += `<line x1="${X0(n)}" y1="${56 - h}" x2="${X0(n)}" y2="${56 + h}" stroke="#2b2118" stroke-width="${big ? 3 : 1.5}"/>`;
    if (big) s += `<text x="${X0(n)}" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118" font-family="Klee One">${n}</text>`;
  }
  nl.tried.forEach((t) => { s += `<circle cx="${X0(t)}" cy="56" r="6" fill="${rnd(t, m, u) === T ? "#3fae7a" : "#b9ad9a"}" stroke="#fff" stroke-width="1.5"/>`; });
  const r = rnd(v, m, u), ok = r === T;
  if (r !== v && r >= min && r <= max) s += `<path d="M${X0(v)} 44 Q${(X0(v) + X0(r)) / 2} 4 ${X0(r)} 44" fill="none" stroke="${ok ? "#3fae7a" : "#d9483b"}" stroke-width="2.5" stroke-dasharray="6 5"/>`;
  s += `<path d="M${X0(v)} 60 l-9 15 h18z" fill="${ok ? "#3fae7a" : "#d9483b"}" stroke="#2b2118" stroke-width="1.5"/>`;
  return `<svg class="nl" id="nlsvg" viewBox="0 0 660 104" aria-label="数直線">${s}</svg>`;
}
function nlHTML(tryLabel) {
  const steps = [nl.u / 10, nl.u / 100, 1].filter((d, i, a) => d >= 1 && a.indexOf(d) === i);
  return `<div id="nlbox">${nlSVG()}
    <div class="nlctl"><input type="range" min="${nl.min}" max="${nl.max}" step="1" value="${nl.v}" oninput="nlSet(+this.value)" aria-label="数を えらぶ">
      ${steps.map((d) => `<button class="stepb" onclick="nlSet(nl.v-${d})">−${d}</button>`).join("")}
      <span class="val k" id="nlval">${nl.v}</span>
      ${steps.slice().reverse().map((d) => `<button class="stepb" onclick="nlSet(nl.v+${d})">+${d}</button>`).join("")}
      ${tryLabel ? `<button class="dark" onclick="nlTry()">${tryLabel}</button>` : ""}</div></div>`;
}
function nlSet(v) {
  nl.v = Math.max(nl.min, Math.min(nl.max, Math.round(v)));
  const box = $("nlbox"); if (!box) return;
  $("nlsvg").outerHTML = nlSVG(); $("nlval").textContent = nl.v;
  box.querySelector("input[type=range]").value = nl.v;
  if (ci === 4) { nl.tried.push(nl.v); $("nlsvg").outerHTML = nlSVG(); sideTry(); }
}

/* ================= キャンプの中（共通のわく） ================= */
function vCamp() {
  const c = CAMPS[ci], q = c.qs[qi], body = [camp1, camp2, camp3, camp4, camp5][ci](q);
  const lvl = solved ? 0 : Math.min(miss, 3);
  return `<header class="bar"><button class="back" onclick="view='map';render()">◀ 山の 地図</button><h1 class="k">キャンプ${ci + 1}　${c.name}</h1></header>
  <main><div class="campv">
    <section class="qcard">
      <div class="step">${c.qs.map((_, i) => `<i class="${i < qi || (i === qi && solved) ? "ok" : i === qi ? "cur" : ""}"></i>`).join("")} もんだい ${qi + 1}／${c.qs.length}</div>
      ${body.card}
      ${body.tool ? `<div class="tool"><h4>さわって たしかめる</h4>${body.tool}</div>` : ""}
    </section>
    <aside class="side" id="side">${sideHTML(body)}</aside>
  </div></main>`;
}
function sideHTML(body) {
  const lvl = solved ? 0 : Math.min(miss, 3);
  const who = solved ? "hana" : lvl >= 2 ? "niji" : "hana";
  const mood = solved ? "happy" : lvl === 1 ? "think" : lvl >= 2 ? "idea" : "normal";
  return `<span class="lion ${miss || solved ? "pop" : ""}">${Lions.svg(who, mood)}</span>
    <div class="say k ${lvl && !solved ? "hint" : ""}">${body.say}</div>
    ${solved ? `<button class="dark" onclick="nextQ()">${qi < CAMPS[ci].qs.length - 1 ? "つぎの もんだい ▶" : "キャンプ クリア！"}</button>`
      : `<div class="lvl">ヒント ${[1, 2, 3].map((i) => `<i class="${lvl >= i ? "on" : ""}"></i>`).join("")}</div>
         ${lvl < 3 ? `<button class="more" onclick="miss++;render()">もっと ヒント</button>` : ""}`}`;
}
function wrong(v) { miss++; last = v; render(); }
function nextQ() {
  if (qi < CAMPS[ci].qs.length - 1) { qi++; newQ(); render(); return; }
  const first = !prog.cleared[ci];
  prog.cleared[ci] = true; save();
  const top = ci === 4;
  $("cele").innerHTML = `<div class="box"><div class="lions">${L("hana", "happy")}${top ? L("niji", "normal") : ""}</div>
    <h2 class="k">${top ? "てっぺんに ついた！" : `キャンプ${ci + 1} クリア！`}</h2>
    <p class="k">${top ? "がい数の 山を のぼりきったね。すごいよ！" : first ? "テントが 緑に なったよ。ひと休みしても いいよ。" : "もう一度 のぼれたね。"}</p>
    <button class="dark" onclick="$('cele').hidden=true;view='map';render()">山の 地図へ</button></div>`;
  $("cele").hidden = false;
}

/* ---------- キャンプ①：位の なまえ ---------- */
function camp1(q) {
  const ds = String(q.n).split(""), Ln = ds.length, target = Ln - 1 - q.p, lvl = Math.min(miss, 3);
  const showNames = solved || lvl >= 2;
  const card = `<h3 class="k">${PLACES[q.p]}の位の 数字を タップしよう。</h3>
    <div class="bignum">${ds.map((d, i) => {
      const cls = solved && i === target ? "right" : X.wrong === i ? "wrong" : lvl >= 3 && i === target ? "target" : "";
      return `<span class="d ${cls}"><span class="top">${showNames ? PLACES[Ln - 1 - i] + "の位" : ""}</span><button ${solved ? "disabled" : ""} onclick="c1Tap(${i})">${d}</button></span>`;
    }).join("")}</div>`;
  let say;
  if (solved) say = `せいかい！ ${PLACES[q.p]}の位は 「${ds[target]}」だね。`;
  else if (lvl === 0) say = "位の 名前は、右はしの 一の位から じゅんに ついて いるよ。";
  else if (lvl === 1) say = last === null ? `${PLACES[q.p]}の位は、右から ${q.p + 1}つ目だよ。` : `そこは ${PLACES[Ln - 1 - last]}の位だよ。${PLACES[q.p]}の位は、右から ${q.p + 1}つ目。`;
  else if (lvl === 2) say = "数字の 上に、位の 名前を 出したよ。見ながら さがしてみて。";
  else say = `いっしょに 右から 数えよう。<ol>${PLACES.slice(0, q.p + 1).map((p, i) => `<li>${p}の位${i === q.p ? " ← ここ！" : ""}</li>`).join("")}</ol>`;
  return { card, say };
}
function c1Tap(i) { const q = CAMPS[0].qs[qi], target = String(q.n).length - 1 - q.p; if (i === target) { solved = true; X.wrong = null; render(); } else { X.wrong = i; wrong(i); } }

/* ---------- キャンプ②：四捨五入 ---------- */
function camp2(q) {
  const u = q.u, r = rnd(q.n, "half", u), Ln = String(q.n).length, look = Ln - exp(u), d = +String(q.n)[look], lvl = Math.min(miss, 3);
  const card = `<h3 class="k">${q.n} を 四捨五入して、${toPlace(u)}の位までの がい数に しよう。</h3>
    ${digitsHTML(q.n, solved || lvl >= 3 ? 2 : lvl >= 2 ? 1 : 0, look)}
    <div class="ansrow">${solved ? `<span class="k" style="font-size:28px">${r}</span>`
      : `<input id="a1" inputmode="numeric" autocomplete="off" aria-label="こたえ" onkeydown="if(event.key==='Enter')c2Check()"><button class="dark" onclick="c2Check()">こたえる</button>`}</div>`;
  const tool = lvl >= 2 || solved ? miniLine(q.n, u, ["half"]) : "";
  let say;
  if (solved) say = `${r}、せいかい！ ${lookPlace(u)}の位を ちゃんと 見られたね。`;
  else if (lvl === 0) say = "数字を よく 見てね。こまったら、まず 答えを 入れて みよう。まちがえても だいじょうぶ！";
  else if (lvl === 1) say = c2Hint(q, last);
  else if (lvl === 2) say = `光って いる ${lookPlace(u)}の位を 見てね。「${d}」は、下の 数直線の どっちがわに あるかな？`;
  else say = `いっしょに やろう。<ol><li>${toPlace(u)}の位は 「${String(q.n)[look - 1]}」。</li>
      <li>${lookPlace(u)}の位は 「${d}」。${d >= 5 ? "5より 大きいから 上がる。" : "4より 小さいから そのまま。"}</li>
      <li>${toPlace(u)}の位は 「${String(r)[look - 1 + String(r).length - Ln]}」に なる。</li><li>${lookPlace(u)}の位から 下は 0。</li></ol>`;
  return { card, tool, say };
}
function c2Hint(q, a) {
  const u = q.u, r = rnd(q.n, "half", u), d = Math.floor(q.n / (u / 10)) % 10;
  if (a === null) return `まずは ${lookPlace(u)}の位の 数字を さがそう。`;
  if (a === Math.floor(q.n / (u / 10)) * (u / 10) || a === rnd(q.n, "half", u / 10)) return `おしい！ ${toPlace(u)}の位までの がい数だから、${lookPlace(u)}の位から 下は ぜんぶ 0に なるよ。`;
  if (a === r - u || a === r + u) return `${lookPlace(u)}の位の 数字は 「${d}」だね。${d >= 5 ? "5より 大きいときは どうするんだっけ？" : "4より 小さいときは どうするんだっけ？"}`;
  if (a % u !== 0) return `${toPlace(u)}の位までの がい数は、さいごが ${"0".repeat(exp(u))} で おわる 数に なるよ。`;
  return `${lookPlace(u)}の位の 数字を 見ると、上げるか そのままか わかるよ。`;
}
function c2Check() { const q = CAMPS[1].qs[qi], v = num($("a1").value); if (v === null) return; if (v === rnd(q.n, "half", q.u)) { solved = true; render(); } else wrong(v); }

// 下と上の キリのいい数の あいだに、その数を おく 小さな数直線
function miniLine(n, u, methods) {
  const lo = Math.floor(n / u) * u, hi = lo + u, P = (v) => 40 + (v - lo) / u * 580;
  let s = `<rect x="${P(lo + u / 2)}" y="30" width="${P(hi) - P(lo + u / 2)}" height="24" fill="#fde3a6"/>`;
  s += `<line x1="24" y1="42" x2="636" y2="42" stroke="#2b2118" stroke-width="3"/>`;
  for (let v = lo; v <= hi; v += u / 10) { const big = v === lo || v === hi, mid = v === lo + u / 2;
    s += `<line x1="${P(v)}" y1="${42 - (big ? 14 : mid ? 11 : 5)}" x2="${P(v)}" y2="${42 + (big ? 14 : mid ? 11 : 5)}" stroke="#2b2118" stroke-width="${big || mid ? 3 : 1.5}"/>`;
    if (big || mid) s += `<text x="${P(v)}" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2118" font-family="Klee One">${v}</text>`; }
  s += `<circle cx="${P(n)}" cy="42" r="8" fill="#f2a516" stroke="#2b2118" stroke-width="2"/>`;
  s += `<text x="${P(n)}" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2118" font-family="BIZ UDPGothic">${n}</text>`;
  if (methods.includes("half")) {
    s += `<text x="${P(lo + u / 4)}" y="100" text-anchor="middle" font-size="13" fill="#8c7f70" font-family="BIZ UDPGothic">ここは 下がる</text>`;
    s += `<text x="${P(lo + u * 3 / 4)}" y="100" text-anchor="middle" font-size="13" fill="#8c7f70" font-family="BIZ UDPGothic">ここは 上がる</text>`;
  }
  if (methods.includes("up")) s += `<text x="${P(hi)}" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#d9483b" font-family="BIZ UDPGothic">切り上げ ↑</text>`;
  if (methods.includes("down")) s += `<text x="${P(lo)}" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#2e93dd" font-family="BIZ UDPGothic">切り捨て ↓</text>`;
  return `<svg class="nl" viewBox="0 0 660 108" aria-label="数直線">${s}</svg>`;
}

/* ---------- キャンプ③：切り上げ・切り捨て ---------- */
const C3M = ["half", "up", "down"];
function camp3(q) {
  const u = 10000, lvl = Math.min(miss, 3), Ln = String(q.n).length, look = Ln - exp(u);
  X.ok = X.ok || {};
  const row = (m) => { const a = rnd(q.n, m, u), ok = X.ok[m];
    return `<div class="ansrow"><span class="lbl k">${MNAME[m]}</span>${ok || solved ? `<input value="${a}" class="ok" disabled aria-label="${MNAME[m]}">`
      : `<input id="c3-${m}" class="${X.ng && X.ng.includes(m) ? "ng" : ""}" inputmode="numeric" autocomplete="off" aria-label="${MNAME[m]}" value="${X.val && X.val[m] != null ? X.val[m] : ""}" onkeydown="if(event.key==='Enter')c3Check()">`}</div>`; };
  const card = `<h3 class="k">${q.n} を、3つの やり方で 一万の位までの がい数に しよう。</h3>
    ${digitsHTML(q.n, lvl >= 2 || solved ? (lvl >= 3 || solved ? 2 : 1) : 0, look)}
    <div class="methods">${C3M.map(row).join("")}</div>
    ${solved ? "" : `<div class="ansrow"><button class="dark" onclick="c3Check()">こたえる</button></div>`}`;
  const tool = lvl >= 2 || solved ? miniLine(q.n, u, ["half", "up", "down"]) : "";
  const firstNg = X.ng && X.ng[0];
  const rest = q.n % u, d = Math.floor(q.n / 1000) % 10;
  const tip = { half: `四捨五入は、千の位の 数字で きめるよ。千の位は 「${d}」。`,
    up: rest ? "切り上げは、千の位から 下に 0じゃない 数が あれば、一万の位を 1つ 上げるよ。" : "切り上げでも、千の位から 下が ぜんぶ 0なら、そのままで いいんだ。",
    down: "切り捨ては、千の位から 下を ぜんぶ 0に するよ。一万の位は そのまま。" };
  let say;
  if (solved) say = "3つとも せいかい！ やり方で 答えが かわるのが わかったね。";
  else if (lvl === 0) say = "四捨五入・切り上げ・切り捨て、3つの ちがいを くらべて みよう。";
  else if (lvl === 1) say = firstNg ? `「${MNAME[firstNg]}」が ちがうよ。${tip[firstNg]}` : tip.half;
  else if (lvl === 2) say = "下の 数直線を 見てね。左が 切り捨て、右が 切り上げの 行き先だよ。";
  else say = `いっしょに やろう。<ol><li>切り捨て：${Math.floor(q.n / u) * u}（下を 0に）</li><li>切り上げ：${rnd(q.n, "up", u)}（${rest ? "1つ 上げる" : "下が 0なので そのまま"}）</li><li>四捨五入：千の位が ${d}だから ${rnd(q.n, "half", u)}</li></ol>`;
  return { card, tool, say };
}
function c3Check() {
  const q = CAMPS[2].qs[qi], u = 10000; X.ng = []; X.val = {};
  for (const m of C3M) { if (X.ok[m]) continue; const el = $("c3-" + m), v = num(el && el.value); X.val[m] = el ? el.value : "";
    if (v === rnd(q.n, m, u)) X.ok[m] = true; else X.ng.push(m); }
  if (!X.ng.length) { solved = true; render(); return; }
  if (C3M.every((m) => X.ok[m] || X.val[m] === "")) { X.ng = C3M.filter((m) => !X.ok[m]); }
  wrong(null);
}

/* ---------- キャンプ④：数直線で ためす ---------- */
function camp4(q) {
  const u = 10000;
  if (!nl) { nlInit(q.m, q.T, u, q.T - u); X.found = []; }
  const lvl = Math.min(miss, 3); nl.mark = lvl >= 2; nl.zone = lvl >= 3 || solved;
  const card = `<h3 class="k">${MNAME[q.m]}して 一万の位までの がい数に したとき、${q.T} に なる 数を ${FIND}つ 見つけよう。</h3>
    ${nlHTML(solved ? "" : "この 数で ためす")}
    <div class="found">${(X.found || []).map((f) => `<span class="k">${f}</span>`).join("")}</div>`;
  return { card, say: c4Say(q, lvl) };
}
function c4Say(q, lvl) {
  if (solved) return `${FIND}つ 見つけたね！ みどりの ところの 数は、どれも ${q.T}に なるよ。`;
  if (X.lastMsg) return X.lastMsg + (lvl >= 2 && !X.hit ? (lvl >= 3 ? "<br>みどりの ところから えらんでみて。" : `<br>${q.T}の 近くを さがしてみて。`) : "");
  return `▲を うごかして、「この 数で ためす」を おしてね。${MTO[q.m]} どうなるか、ぼくが すぐ 言うよ。`;
}
function nlTry() {
  const q = CAMPS[3].qs[qi], r = rnd(nl.v, q.m, nl.u); nl.tried.push(nl.v);
  if (r === q.T) {
    X.hit = true;
    if (X.found.includes(nl.v)) X.lastMsg = `${nl.v}は もう 見つけたね。ほかの 数も ためしてみて。`;
    else { X.found.push(nl.v); X.lastMsg = `${nl.v}を ${MTO[q.m]} ${q.T}！ 1つ 見つけた！`; }
    if (X.found.length >= FIND) solved = true;
    render();
  } else {
    X.hit = false;
    X.lastMsg = `${nl.v}を ${MTO[q.m]}、${r}に なっちゃうよ。` + (q.m === "up" && nl.v % nl.u === 0 ? "下が ぜんぶ 0だと、上がらないんだ。" : "");
    wrong(nl.v);
  }
}
function sideTry() {}

/* ---------- キャンプ⑤：はんいを 見つける ---------- */
function camp5(q) {
  const u = q.u || 10000, [Lo, Hi] = range(q.m, q.T, u), lvl = Math.min(miss, 3);
  if (lvl >= 2 && !nl) nlInit(q.m, q.T, u, q.m === "up" ? q.T - u : q.m === "down" ? q.T + u : q.T);
  if (nl) nl.zone = lvl >= 3 || solved;
  const val = (k) => X.val && X.val[k] != null ? X.val[k] : "";
  const card = `<h3 class="k">${MNAME[q.m]}して、${toPlace(u)}の位までの がい数に したとき、${q.T} に なる 数の はんいを 答えよう。</h3>
    <div class="ansrow">${solved ? `<span class="k" style="font-size:28px">${Lo} 以上　${Hi} 以下</span>`
      : `<input id="lo" inputmode="numeric" autocomplete="off" aria-label="以上の数" value="${val("lo")}"><span class="k">以上</span>
         <input id="hi" inputmode="numeric" autocomplete="off" aria-label="以下の数" value="${val("hi")}" onkeydown="if(event.key==='Enter')c5Check()"><span class="k">以下</span>
         <button class="dark" onclick="c5Check()">こたえる</button>`}</div>`;
  const tool = nl ? nlHTML("") : "";
  let say;
  if (solved) say = `せいかい！ ${Lo}より 1つ 小さい ${Lo - 1}は ${rnd(Lo - 1, q.m, u)}、${Hi}より 1つ 大きい ${Hi + 1}は ${rnd(Hi + 1, q.m, u)}に なるから、ここが はじっこなんだね。`;
  else if (lvl === 0) say = `${q.T}に なる、いちばん 小さい 数と いちばん 大きい 数を 考えよう。`;
  else if (lvl === 1) say = c5Hint(q, u, last);
  else if (lvl === 2) say = "下の 数直線で ▲を うごかして、はじっこの 数を さがしてみて。みどりの まるは ${T}に なる 数だよ。".replace("${T}", q.T);
  else say = `いっしょに やろう。<ol><li>いちばん 小さい 数は ${Lo}。${Lo - 1}は ${rnd(Lo - 1, q.m, u)}に なっちゃう。</li><li>いちばん 大きい 数は ${Hi}。${Hi + 1}は ${rnd(Hi + 1, q.m, u)}に なっちゃう。</li><li>みどりの ところが ${q.T}に なる はんい。</li></ol>`;
  return { card, tool, say };
}
function c5Hint(q, u, a) {
  const [Lo, Hi] = range(q.m, q.T, u);
  if (!a) return "まずは、思いついた 数を 入れて みよう。";
  const [lo, hi] = a, out = [];
  if (lo > hi) return "左には 小さいほうの 数、右には 大きいほうの 数を 入れるよ。";
  for (const m of ["up", "down", "half"]) if (m !== q.m) { const [a1, b1] = range(m, q.T, u); if (lo === a1 && hi === b1) return `それは「${MNAME[m]}」の ときの はんいだね。この もんだいは「${MNAME[q.m]}」だよ。`; }
  const chk = (n, side) => { const r = rnd(n, q.m, u);
    if (r !== q.T) return `${n}を ${MTO[q.m]}、${r}に なっちゃうよ。` + (q.m === "up" && n === q.T - u ? "下が ぜんぶ 0だから、上げるものが ないんだ。" : "");
    if (side === "lo" && n > Lo) return `${n}は ${q.T}に なるね。でも、もっと 小さい 数でも ${q.T}に なるよ。`;
    if (side === "hi" && n < Hi) return `${n}は ${q.T}に なるね。でも、もっと 大きい 数でも ${q.T}に なるよ。`;
    return ""; };
  const m1 = chk(lo, "lo"), m2 = chk(hi, "hi");
  return (m1 || `「以上」の ${lo}は せいかい！`) + "<br>" + (m2 || `「以下」の ${hi}は せいかい！`);
}
function c5Check() {
  const q = CAMPS[4].qs[qi], u = q.u || 10000, lo = num($("lo").value), hi = num($("hi").value);
  X.val = { lo: $("lo").value, hi: $("hi").value };
  if (lo === null || hi === null) return;
  const [Lo, Hi] = range(q.m, q.T, u);
  if (lo === Lo && hi === Hi) { solved = true; render(); } else wrong([lo, hi]);
}

/* ================= 表示 ================= */
function render() {
  $("app").innerHTML = view === "map" ? vMap() : vCamp();
  const first = document.querySelector(".qcard input:not([disabled])"); if (first && !solved) first.focus({ preventScroll: true });
}
render();
</script>
</body>
